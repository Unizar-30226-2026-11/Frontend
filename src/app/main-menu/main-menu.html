<section class="menu-layout">
  <section class="showcase-column">
    <app-menu-showcase
      [collections]="collections"
      [totalCards]="totalCards"
      [collectedCards]="collectedCards"
      [cardsLoading]="cardsLoading"
      [cardsError]="cardsError"
      [boards]="boards"
      [selectedBoard]="selectedBoard"
      [selectedBoardId]="selectedBoardId"
      [boardsLoading]="boardsLoading"
      [boardsError]="boardsError"
      [boardActionMessage]="boardActionMessage"
      [boardActionError]="boardActionError"
      [activatingBoard]="activatingBoard"
      [boardTitle]="'Seleccion de tableros:'"
      (boardSelectionChange)="onBoardSelected($event)"
      (activateBoard)="activateSelectedBoard()"
      (toggleCollection)="toggleCollection($event)"
    />
  </section>

  <aside class="action-column">
    <article class="action-panel">
      <h2 class="action-title">Adentrate a jugar</h2>

      <div class="action-stack">
        <button type="button" class="action-button primary" (click)="goToGames()">
          <strong>Buscar partida</strong>
          <span class="action-glyph">→</span>
        </button>

        <button type="button" class="action-button" (click)="goToStore()">
          <strong>Comprar cartas</strong>
          <span class="action-glyph">→</span>
        </button>

        <button type="button" class="action-button accent" (click)="goToDeckBuilder()">
          <strong>Crear mazo</strong>
          <span class="action-glyph">→</span>
        </button>
      </div>
    </article>
  </aside>
</section>
