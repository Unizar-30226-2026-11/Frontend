    <article class="decks-card">
      <div class="deck-img">
        <img [src]="deckImageSrc" [alt]="deckName || 'Item de tienda'" />
        <div class="deck-copy">
          <h3>{{ deckName }}</h3>
          <p>{{ deckType }}</p>
        </div>
      </div>
      <div class="deck-footer" [class.deck-footer-owned]="deckOwned">
        <button
          type="button"
          class="deck-button"
          [disabled]="deckOwned || buying || !canBuy"
          (click)="onBuyClick()"
        >
          @if (buying) {
            Comprando...
          } @else if (deckOwned) {
            Ya adquirido
          } @else if (!canBuy) {
            Sin saldo
          } @else {
            Comprar
          }
        </button>
        @if (!deckOwned) {
          <div class="deck-price">
            <span class="coin-icon" aria-hidden="true"></span>
            <span>{{ deckPrice }}</span>
          </div>
        }
      </div>
    </article>
