@if (shouldShowNavigation()) {
  <app-navigation-bar />
}
@if (shouldShowActiveGameBanner()) {
  <section class="active-game-banner" role="status" aria-live="polite">
    <div class="active-game-copy">
      <p class="active-game-eyebrow">Partida activa detectada</p>
      <strong>Tu sesion tiene una partida en curso</strong>
      <span>{{ activeGameBannerMessage() }}</span>
    </div>
    <button type="button" class="active-game-button" (click)="goToActiveGame()">
      Volver a la partida
    </button>
  </section>
}
<main class="app-content">
  <router-outlet />
</main>
@if (activeToastMessage(); as toastMessage) {
  <aside class="app-toast" role="status" aria-live="polite">
    {{ toastMessage }}
  </aside>
}
